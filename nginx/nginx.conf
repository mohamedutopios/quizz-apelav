user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs (pas de password ni de cookie sensible)
    log_format main_secure '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct=$upstream_connect_time '
                           'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main_secure;
    error_log  /var/log/nginx/error.log warn;

    # Perfs
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;        # Masque la version nginx
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_timeout 12s;
    client_body_timeout 12s;
    send_timeout 10s;
    reset_timedout_connection on;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # Zones de rate-limit
    # 10 req/s par IP en moyenne pour l'API, burst à 30
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=10r/s;
    # 5 req/s pour les endpoints sensibles (login, register)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # Limite de connexions simultanées par IP
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Upstream backend
    upstream apelav_backend {
        server backend:4000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # Redirection HTTP -> HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Réponse au healthcheck ALB / local
        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Serveur HTTPS principal
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # ---- TLS ----
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # ---- Headers de sécurité ----
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header X-Frame-Options            "DENY" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        # CSP : 'unsafe-inline' nécessaire pour les styles Tailwind injectés en runtime + Google Fonts
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        limit_conn conn_per_ip 50;

        # ---- API ----
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            # Rate-limit plus strict sur l'auth
            location ~ ^/api/auth/(login|register)$ {
                limit_req zone=auth_limit burst=10 nodelay;
                proxy_pass http://apelav_backend;
                include /etc/nginx/proxy_params.conf;
            }

            proxy_pass http://apelav_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ---- Frontend SPA ----
        root /usr/share/nginx/html;
        index index.html;

        # Assets versionnés (cache long)
        location ~* \.(js|css|svg|woff2?|ttf|eot|ico|png|jpe?g|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Bloque l'accès aux fichiers cachés
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
